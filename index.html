<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Foclyra · Distraction-Free Study Studio</title>
    <meta name="title" content="Foclyra · Distraction-Free Study Studio" />
    <meta name="description" content="Transform YouTube playlists into structured, distraction-free courses. Zero algorithmic rabbit holes, live timestamped notes, Pomodoro focus timer, and cloud sync." />
    <meta name="keywords" content="study studio, distraction-free youtube, youtube courses, study notes, pomodoro focus, online learning, playlist to course, ad-free study" />
    <meta name="author" content="Foclyra" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://foclyra-studio.vercel.app/" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://foclyra-studio.vercel.app/" />
    <meta property="og:site_name" content="Foclyra" />
    <meta property="og:title" content="Foclyra · Distraction-Free Study Studio" />
    <meta property="og:description" content="Transform YouTube playlists into structured, distraction-free courses. Zero algorithmic rabbit holes, live timestamped notes, Pomodoro focus timer, and cloud sync." />
    <meta property="og:image" content="https://foclyra-studio.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Foclyra Distraction-Free Study Studio" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://foclyra-studio.vercel.app/" />
    <meta name="twitter:title" content="Foclyra · Distraction-Free Study Studio" />
    <meta name="twitter:description" content="Transform YouTube playlists into structured, distraction-free courses. Zero algorithmic rabbit holes, live timestamped notes, Pomodoro focus timer, and cloud sync." />
    <meta name="twitter:image" content="https://foclyra-studio.vercel.app/og-image.jpg" />

    <!-- Theme & Color Schemes -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)" />

    <script>
      (function() {
        try {
          var t = localStorage.getItem('foclyra_theme');
          var dark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
