<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181920"/>
      <stop offset="100%" stop-color="#0D0E12"/>
    </linearGradient>
    <linearGradient id="mintAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5BF5DE"/>
      <stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>
    <filter id="glowAcc" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00F5D4" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Deep Charcoal Squircle -->
  <rect width="48" height="48" rx="13" fill="url(#logoBg)" stroke="#2A2E39" stroke-width="1.5"/>

  <!-- Outer Focal Brackets (Focus Reticle) -->
  <path d="M12 18 L12 12 L18 12" fill="none" stroke="#00F5D4" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>
  <path d="M36 18 L36 12 L30 12" fill="none" stroke="#00F5D4" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>
  <path d="M12 30 L12 36 L18 36" fill="none" stroke="#00F5D4" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>
  <path d="M36 30 L36 36 L30 36" fill="none" stroke="#00F5D4" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>

  <!-- High-Precision Play / Focus Arrow -->
  <path d="M19 14.5 L34.5 24 L19 33.5 Z" fill="url(#mintAcc)" filter="url(#glowAcc)"/>

  <!-- Core Laser Precision Focal Dot -->
  <circle cx="24" cy="24" r="2" fill="#FFFFFF" opacity="0.95"/>
</svg>