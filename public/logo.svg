<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C24"/>
      <stop offset="100%" stop-color="#111216"/>
    </linearGradient>
    <linearGradient id="logoMintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EECD3"/>
      <stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00F5D4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Deep Matte Charcoal Rounded Squircle with safe inset to guarantee no edge clipping -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#logoBgGrad)" stroke="#2A2E39" stroke-width="2"/>

  <!-- Perfectly Centered Rounded Play Triangle (No cluttered bottom bar) -->
  <path
    d="M 25,20.4 A 4 4 0 0 1 29,17.0 L 43.6,28.6 A 4 4 0 0 1 43.6,35.4 L 29,47.0 A 4 4 0 0 1 25,43.6 Z"
    fill="url(#logoMintGrad)"
    filter="url(#softGlow)"
  />
</svg>