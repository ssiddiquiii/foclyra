<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Tactile Mint-Emerald Outer Squircle (matches Foclyra brand primary #00F5D4) -->
    <linearGradient id="foclyraMintTile" x1="32" y1="2" x2="32" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5DF5E0"/>
      <stop offset="55%" stop-color="#14D9BE"/>
      <stop offset="100%" stop-color="#059B87"/>
    </linearGradient>

    <!-- Top inner specular sheen -->
    <linearGradient id="foclyraInnerRim" x1="32" y1="3" x2="32" y2="61" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="28%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#003830" stop-opacity="0.22"/>
    </linearGradient>

    <!-- Deep Obsidian Studio Screen -->
    <linearGradient id="foclyraInk" x1="16" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22252F"/>
      <stop offset="100%" stop-color="#0E1015"/>
    </linearGradient>

    <!-- Soft elevation shadow for the inner glyph -->
    <filter id="glyphShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#023A32" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Tactile Mint-Emerald App Squircle -->
  <rect x="3" y="3" width="58" height="58" rx="15.5" fill="url(#foclyraMintTile)"/>
  <rect x="3.75" y="3.75" width="56.5" height="56.5" rx="14.75" stroke="url(#foclyraInnerRim)" stroke-width="1.5"/>

  <!-- Back Playlist / Course Stack Layer -->
  <rect x="19" y="13" width="26" height="6" rx="3" fill="#0A1917" fill-opacity="0.26"/>

  <!-- Main Study Screen Body (Video Player + Note Tag) -->
  <g filter="url(#glyphShadow)">
    <rect x="13" y="18" width="38" height="30" rx="8.5" fill="url(#foclyraInk)"/>

    <!-- Clean Optical Play Cutout (Left/Center) -->
    <path
      d="M23.5 27.6C23.5 26.39 24.82 25.64 25.86 26.26L34.72 31.56C35.73 32.16 35.73 33.64 34.72 34.24L25.86 39.54C24.82 40.16 23.5 39.41 23.5 38.2V27.6Z"
      fill="#F8FAFC"
    />

    <!-- Timestamped Note Lines (Right Side of Studio Split-Screen) -->
    <rect x="39" y="26.5" width="6.5" height="3.2" rx="1.6" fill="#3CF2D8"/>
    <rect x="39" y="32.2" width="6.5" height="3.2" rx="1.6" fill="#F8FAFC" fill-opacity="0.45"/>
    <rect x="39" y="37.9" width="4.5" height="3.2" rx="1.6" fill="#F8FAFC" fill-opacity="0.45"/>
  </g>
</svg>
