<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181920"/>
      <stop offset="100%" stop-color="#0e0f13"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5BF5DE"/>
      <stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#00F5D4" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Charcoal Rounded Background -->
  <rect width="32" height="32" rx="8" fill="url(#bgGrad)" stroke="#2A2E39" stroke-width="1"/>

  <!-- Subtle Mint Energy Ring -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#00F5D4" stroke-width="1" opacity="0.25" stroke-dasharray="3 3"/>

  <!-- Focal Dynamic Play & Star Geometry -->
  <path d="M12.5 9.5 L24 16 L12.5 22.5 Z" fill="url(#mintGrad)" filter="url(#glow)"/>
  
  <!-- Focal Star Aperture Accents -->
  <circle cx="16" cy="6.5" r="1.2" fill="#00F5D4"/>
  <circle cx="16" cy="25.5" r="1.2" fill="#00F5D4" opacity="0.7"/>
  <circle cx="6.5" cy="16" r="1.2" fill="#00F5D4" opacity="0.7"/>
  <circle cx="25.5" cy="16" r="1.2" fill="#00F5D4"/>
</svg>