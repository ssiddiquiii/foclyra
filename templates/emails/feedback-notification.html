<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Feedback</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <div style="max-width: 580px; margin: 0 auto; padding: 24px 16px;">
    <div style="background-color: #ffffff; border-radius: 20px; border: 1px solid #e4e4e7; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.04);">
      
      <!-- Header -->
      <div style="padding: 24px 28px 16px 28px; border-bottom: 1px solid #f4f4f5;">
        <span style="display: inline-block; padding: 3px 10px; border-radius: 100px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; background: #fee2e2; color: #991b1b;">
          Feedback
        </span>
        <h2 style="margin: 10px 0 2px 0; font-size: 19px; color: #09090b; letter-spacing: -0.02em;">User Feedback</h2>
        <p style="margin: 0; font-size: 13px; color: #71717a;">From: <strong>User Name</strong> (<a href="mailto:user@domain.com" style="color: #09090b; text-decoration: underline;">user@domain.com</a>)</p>
      </div>

      <!-- Body -->
      <div style="padding: 20px 28px 24px 28px;">
        <h3 style="font-size: 11px; text-transform: uppercase; color: #71717a; letter-spacing: 0.05em; margin: 0 0 8px 0;">Message:</h3>
        <div style="background-color: #fafafa; border: 1px solid #e4e4e7; border-radius: 14px; padding: 16px; font-size: 14px; line-height: 1.6; color: #18181b; white-space: pre-wrap;">User message goes here...</div>

        <!-- Attached Screenshot -->
        <div style="margin-top: 18px;">
          <h3 style="font-size: 11px; text-transform: uppercase; color: #71717a; letter-spacing: 0.05em; margin: 0 0 8px 0;">Attached Screenshot:</h3>
          <img src="cid:user-screenshot" alt="User Screenshot" style="max-width: 100%; height: auto; border-radius: 12px; border: 1px solid #e4e4e7; display: block;" />
        </div>

        <!-- Quick Reply -->
        <div style="text-align: center; margin-top: 24px;">
          <a href="mailto:user@domain.com?subject=Re:%20Foclyra%20Feedback" style="display: inline-block; background-color: #09090b; color: #ffffff !important; font-size: 12.5px; font-weight: 600; text-decoration: none; padding: 10px 24px; border-radius: 100px;">
            Reply to User →
          </a>
        </div>
      </div>

      <!-- Clean Minimal Footer -->
      <div style="border-top: 1px solid #f4f4f5; padding: 12px 28px; text-align: center; font-size: 11px; color: #a1a1aa;">
        Foclyra Feedback Notification
      </div>
    </div>
  </div>
</body>
</html>
